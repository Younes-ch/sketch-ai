<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Viewport - disable zoom on mobile for canvas drawing -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Theme -->
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="color-scheme" content="dark" />

  <!-- SEO -->
  <title>SkribblAI - Draw & Guess Game</title>
  <meta name="description"
    content="A fun multiplayer drawing and guessing game. Draw, guess, and compete with friends in real-time!" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SkribblAI - Draw & Guess Game" />
  <meta property="og:description"
    content="A fun multiplayer drawing and guessing game. Draw, guess, and compete with friends in real-time!" />
  <meta property="og:image" content="/og-image.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SkribblAI - Draw & Guess Game" />
  <meta name="twitter:description"
    content="A fun multiplayer drawing and guessing game. Draw, guess, and compete with friends in real-time!" />
  <meta name="twitter:image" content="/og-image.png" />
</head>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
