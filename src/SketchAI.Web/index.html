<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Fonts - Nunito, self-hosted (@font-face in App.css); latin is needed for first paint -->
  <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Viewport - canvas blocks pinch-zoom itself via touch-action: none -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Theme -->
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="color-scheme" content="dark" />

  <!-- SEO -->
  <title>SketchAI – Free Multiplayer Draw & Guess Game with AI</title>
  <meta name="description"
    content="Free online draw & guess game, Pictionary-style. Create a private room, invite friends with a link and play in your browser. No sign-up. AI can draw too!" />
  <link rel="canonical" href="https://sketch-ai.dev/" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SketchAI",
      "alternateName": ["Sketch AI", "sketch-ai.dev"],
      "url": "https://sketch-ai.dev/"
    }
  </script>

  <!-- Open Graph / Social (absolute URLs required) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SketchAI" />
  <meta property="og:url" content="https://sketch-ai.dev/" />
  <meta property="og:title" content="SketchAI – Free Multiplayer Draw & Guess Game with AI" />
  <meta property="og:description"
    content="Free online draw & guess game, Pictionary-style. Create a private room, invite friends with a link and play in your browser. No sign-up. AI can draw too!" />
  <meta property="og:image" content="https://sketch-ai.dev/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="SketchAI – multiplayer draw & guess game" />

  <!-- Twitter (title, description and image fall back to og:*) -->
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <!-- Runtime config injected by Docker/nginx in production -->
  <script src="/config.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
