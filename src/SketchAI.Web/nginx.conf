# Cache policy by path. Set once at server level: a location-level add_header would
# drop the security headers below (nginx doesn't inherit add_header into such locations).
map $uri $cache_control {
    ~^/assets/                          "public, max-age=31536000, immutable"; # hashed build output
    ~\.(png|ico|svg|mp3|woff2)$          "public, max-age=604800";              # stable names, may change on deploy
    default                             "no-cache";                            # index.html, config.js, robots/sitemap
}

server {
    listen ${PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # One canonical host for search engines
    if ($host = www.sketch-ai.dev) {
        return 301 https://sketch-ai.dev$request_uri;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Unknown paths get a real 404 (not a soft-404 duplicate of the homepage) but still show the app
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /index.html;

    add_header Cache-Control $cache_control always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
