# ─────────────────────────────────────────────
#  SketchAI – React Frontend
# ─────────────────────────────────────────────
app = 'sketchai'
primary_region = 'cdg'

[build]
  dockerfile = 'deploy/fly/Dockerfile.web'

[env]
  PORT = '8080'
  # API_URL and TURNSTILE_SITE_KEY are set via `fly secrets set`
  # (they're injected into config.js at container startup)

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size   = 'shared-cpu-1x'
  memory = '256mb'
