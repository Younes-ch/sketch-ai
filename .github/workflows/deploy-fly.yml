name: Deploy to Fly.io

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  # ── Detect which services changed ──
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      redis: ${{ steps.filter.outputs.redis }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/SketchAI.Api/**'
              - 'src/SketchAI.ServiceDefaults/**'
              - 'deploy/fly/Dockerfile.api'
              - 'deploy/fly/entrypoint-api.sh'
              - 'deploy/fly/fly.api.toml'
              - 'Directory.Packages.props'
              - 'global.json'
            web:
              - 'src/SketchAI.Web/**'
              - 'deploy/fly/Dockerfile.web'
              - 'deploy/fly/fly.web.toml'
            redis:
              - 'deploy/fly/Dockerfile.redis'
              - 'deploy/fly/fly.redis.toml'

  # ── Deploy Redis (only if config changed) ──
  deploy-redis:
    name: Deploy Redis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.redis == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Redis
        run: flyctl deploy . --config deploy/fly/fly.redis.toml --remote-only --yes

  # ── Deploy API ──
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [changes, deploy-redis]
    if: always() && needs.changes.outputs.api == 'true' && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        run: flyctl deploy . --config deploy/fly/fly.api.toml --ha=false --remote-only --yes

  # ── Deploy Web ──
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [changes, deploy-api]
    if: always() && needs.changes.outputs.web == 'true' && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Web
        run: flyctl deploy . --config deploy/fly/fly.web.toml --ha=false --remote-only --yes
